<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FANG INVESTMENT</title>
  <meta name="description" content="FANG INVESTMENT (方投资) — a multi-generation family investment office connecting global capital with discipline and trust.">

  <!-- Favicon: 方 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230f1d3a'/%3E%3Ctext x='32' y='46' font-size='44' text-anchor='middle' fill='%23b08947' font-family='serif'%3E%E6%96%B9%3C/text%3E%3C/svg%3E">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    :root {
      --navy-deep: #08152a;
      --viewport-height: 1vh;
      color-scheme: dark;
    }

    html,
    body {
      width: 100%;
      min-width: 0;
      height: 100%;
      margin: 0;
      background: var(--navy-deep);
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    .hero {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      width: 100%;
      height: calc(var(--viewport-height, 1vh) * 100);
      padding:
        env(safe-area-inset-top, 0)
        env(safe-area-inset-right, 0)
        env(safe-area-inset-bottom, 0)
        env(safe-area-inset-left, 0);
      background: var(--navy-deep);
      overflow: hidden;
    }

    @supports (height: 100dvh) {
      .hero {
        height: 100dvh;
      }
    }

    .hero-image {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      object-position: center;
      user-select: none;
      -webkit-user-drag: none;
    }

    .hero-backdrop {
      position: absolute;
      inset: -8%;
      display: block;
      width: 116%;
      height: 116%;
      object-fit: cover;
      object-position: center;
      filter: blur(26px) saturate(0.88);
      opacity: 0.6;
      transform: scale(1.04);
      user-select: none;
      -webkit-user-drag: none;
    }

    .hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(8, 21, 42, 0.18);
      pointer-events: none;
    }

    @media (min-aspect-ratio: 3 / 2) {
      .hero-backdrop,
      .hero::after {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main class="hero">
    <img
      class="hero-backdrop"
      src="assets/slide-fang-hero.jpg"
      alt=""
      aria-hidden="true"
      decoding="async"
    >
    <img
      class="hero-image"
      src="assets/slide-fang-hero.jpg"
      alt="FANG INVESTMENT"
      decoding="async"
      fetchpriority="high"
    >
  </main>

  <script>
    // Compatibility fallback for older iOS, Android and HarmonyOS browsers.
    (function () {
      function syncViewportHeight() {
        var viewport = window.visualViewport;
        var height = viewport ? viewport.height : window.innerHeight;
        document.documentElement.style.setProperty('--viewport-height', height * 0.01 + 'px');
      }

      syncViewportHeight();
      window.addEventListener('resize', syncViewportHeight, { passive: true });
      window.addEventListener('orientationchange', syncViewportHeight, { passive: true });

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', syncViewportHeight, { passive: true });
      }
    })();
  </script>
</body>
</html>
