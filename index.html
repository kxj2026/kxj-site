<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FANG INVESTMENT · 方投资</title>
  <meta name="description" content="FANG INVESTMENT (方投资) — a multi-generation family investment office connecting global capital with discipline and trust.">

  <!-- Favicon: 方 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230f1d3a'/%3E%3Ctext x='32' y='46' font-size='44' text-anchor='middle' fill='%23b08947' font-family='serif'%3E%E6%96%B9%3C/text%3E%3C/svg%3E">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&family=Noto+Serif+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #0f1d3a;
      --navy-deep: #08152a;
      --gold: #b08947;
      --gold-light: #d9b984;
      --display: 'Cinzel', 'Cormorant Garamond', serif;
      --serif: 'Cormorant Garamond', 'Noto Serif SC', Georgia, serif;
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }

    html, body { height: 100%; }
    body {
      font-family: var(--sans);
      background: var(--navy-deep);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* 单张全屏图（原轮播图第一张，去掉滚动/切换） */
    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background-image: url('assets/slide-fang-hero.jpg');
      background-size: cover;
      background-position: center;
    }
    /* 暗化遮罩，确保文字可读 */
    .hero-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(8,21,42,.45) 0%, rgba(8,21,42,0) 35%, rgba(8,21,42,0) 55%, rgba(8,21,42,.72) 100%),
        radial-gradient(ellipse 80% 60% at 50% 40%, rgba(8,21,42,.05) 0%, rgba(8,21,42,.35) 100%);
    }

    .slide-caption {
      position: absolute;
      z-index: 2;
      color: #fff;
      max-width: 880px;
      left: 7vw;
      bottom: 11vh;
    }
    .slide-caption .label {
      font-family: var(--sans);
      font-size: 12px;
      letter-spacing: .34em;
      text-transform: uppercase;
      color: var(--gold-light);
      margin-bottom: 18px;
      display: inline-flex;
      align-items: center;
      gap: 14px;
    }
    .slide-caption .label::before {
      content: '';
      width: 34px;
      height: 1px;
      background: var(--gold-light);
    }
    .slide-caption h2 {
      font-family: var(--serif);
      font-weight: 500;
      font-size: clamp(34px, 5.2vw, 72px);
      line-height: 1.08;
      letter-spacing: -.01em;
      text-shadow: 0 2px 24px rgba(8,21,42,.4);
    }
    .slide-caption p {
      margin-top: 18px;
      font-family: var(--sans);
      font-weight: 300;
      font-size: clamp(14px, 1.4vw, 18px);
      letter-spacing: .04em;
      line-height: 1.7;
      max-width: 520px;
      color: rgba(255,255,255,.86);
    }

    /* 顶部品牌 */
    .brand-mark {
      position: absolute;
      top: 4vh;
      left: 7vw;
      z-index: 5;
      display: flex;
      align-items: baseline;
      gap: 12px;
      font-family: var(--display);
      letter-spacing: .12em;
      color: #fff;
      text-shadow: 0 2px 16px rgba(8,21,42,.5);
    }
    .brand-mark .mark { font-size: 22px; font-weight: 500; }
    .brand-mark .tag {
      font-family: var(--sans);
      font-size: 10px;
      letter-spacing: .35em;
      text-transform: uppercase;
      color: var(--gold-light);
      border-left: 1px solid rgba(255,255,255,.3);
      padding-left: 12px;
    }
  </style>
</head>
<body>
  <div class="hero">
    <div class="brand-mark">
      <span class="mark">FANG</span>
      <span class="tag">Investment · 方投资</span>
    </div>

    <div class="hero-bg"></div>

    <div class="slide-caption">
      <span class="label">Generations of Vision</span>
      <h2>Built for tomorrow.</h2>
      <p>Patient capital and a global horizon — a multi-generation family investment office compounding value across decades.</p>
    </div>
  </div>
</body>
</html>
